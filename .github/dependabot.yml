version: 2
updates:
  # Grouped weekly: one pull request per ecosystem keeps the review load predictable.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: development
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: development
    groups:
      actions:
        patterns: ['*']
