<!DOCTYPE html>
<html lang="en">
<head>
    <link href="./fontawesome-free-6.4.0-web/css/fontawesome.css" rel="stylesheet">
    <link href="./fontawesome-free-6.4.0-web/css/brands.css" rel="stylesheet">
    <link href="./fontawesome-free-6.4.0-web/css/solid.css" rel="stylesheet">
</head>
<body style="height: 2000px;">
    <div class="popUpSkills" style="display: grid; grid-template-columns: repeat(1, 1fr); grid-template-rows: repeat(8, 1fr); grid-auto-flow: dense; align-items: center; background-color: rgba(135, 135, 135, 0.73); width: 30vw; height: 80vh; margin: 0 auto; border-radius: 25px; padding: 4vh; border: 1px solid black; font-size: 30px; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);">
        <section style="display: flex; justify-content: space-around; flex-wrap: wrap;">   <!-- WEB DEV -->
            <section>   <!-- FRONT -->
                <i class="btn btn-outline-light fa-brands fa-html5"></i>
                <i class="btn btn-outline-light fa-brands fa-css3-alt"></i>
                <i class="btn btn-outline-light fa-brands fa-sass"></i>
                <i class="btn btn-outline-light fa-brands fa-js"></i>
                <i class="btn btn-outline-light fa-brands fa-bootstrap"></i>
                <i class="btn btn-outline-light fa-brands fa-react"></i>
            </section>
            <section>   <!-- back -->
                <i class="btn btn-outline-light fa-brands fa-php"></i>
                <i class="btn btn-outline-light fa-brands fa-laravel"></i>
                <i class="btn btn-outline-light fa-brands fa-angular"></i>
                <i class="btn btn-outline-light fa-brands fa-typescript"></i>
                <i class="btn btn-outline-light fa-brands fa-node-js"></i>
                <i class="btn btn-outline-light fa-brands fa-npm"></i>
                <i class="btn btn-outline-light fa-brands fa-docker"></i>
                <i class="btn btn-outline-light fa-brands fa-redhat"></i>
                <i class="btn btn-outline-light fa-brands fa-vuejs"></i>
                <i class="btn btn-outline-light fa-brands fa-cloudflare"></i>
            </section>
        </section>

        <section style="display: flex; justify-content: space-evenly; flex-wrap: wrap;">   <!-- versioning -->
            <i class="btn btn-outline-light fa-brands fa-git-alt"></i>
            <i class="btn btn-outline-light fa-brands fa-gitlab"></i>
            <i class="btn btn-outline-light fa-brands fa-github"></i>
            <i class="btn btn-outline-light fa-brands fa-sourcetree"></i>
        </section>

        <section style="display: flex; justify-content: space-evenly; flex-wrap: wrap;">   <!-- Software Programming -->
            <i class="btn btn-outline-light fa-solid fa-c"></i>
            <i class="btn btn-outline-light fa-brands fa-java"></i>
            <i class="btn btn-outline-light fa-brands fa-python"></i>
            <i class="btn btn-outline-light fa-brands fa-swift"></i>
            <i class="btn btn-outline-light fa-brands fa-python"></i>
            <i class="btn btn-outline-light fa-brands fa-jenkins"></i>
        </section>

        <section style="display: flex; justify-content: space-evenly; flex-wrap: wrap;">   <!-- storage -->
            <i class="btn btn-outline-light fa-solid fa-database"></i>
        </section>

        <section style="display: flex; justify-content: space-evenly; flex-wrap: wrap;">   <!-- OS -->
            <i class="btn btn-outline-light fa-brands fa-apple"></i>
            <i class="btn btn-outline-light fa-brands fa-android"></i>
            <i class="btn btn-outline-light fa-brands fa-windows"></i>
            <i class="btn btn-outline-light fa-brands fa-linux"></i>
        </section>

        <section style="display: flex; justify-content: space-evenly; flex-wrap: wrap;">   <!-- ticketing/story -->
            <i class="btn btn-outline-light fa-brands fa-atlassian"></i>
            <i class="btn btn-outline-light fa-brands fa-jira"></i>
            <i class="btn btn-outline-light fa-brands fa-confluence"></i>
        </section>

        <section style="display: flex; justify-content: space-evenly; flex-wrap: wrap;">   <!-- msgs -->
            <i class="btn btn-outline-light fa-brands fa-slack"></i>
            <i class="btn btn-outline-light fa-brands fa-discord"></i>
        </section>

        <section style="display: flex; justify-content: space-evenly; flex-wrap: wrap;">   <!-- office -->
            <i class="btn btn-outline-light fa-solid fa-file-excel"></i>
            <i class="btn btn-outline-light fa-solid fa-file-powerpoint"></i>
            <i class="btn btn-outline-light fa-solid fa-file-word"></i>
        </section>
    </div>


    <script src="./js/onScrollAnimation/onScroll.js"></script>
</body>
</html>
